<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jyotish Numero</title>
    <meta
      name="description"
      content="Jyotish Numero – Free Horoscope, Numerology, Mobile Number Check, Name Analysis and Lo Shu."
    />
    <style>
      :root {
        --bg-deep: #201a6c;
        --bg-mid: #3d2d84;
        --bg-rose: #8d3b78;
        --gold: #f2c96b;
        --gold-strong: #ddad4a;
        --text: #f3effe;
        --muted: rgba(243, 239, 254, 0.9);
        --star: #f5d36a;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 38%, var(--bg-rose) 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .page {
        position: relative;
        width: 100%;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 0%, rgba(244, 168, 93, 0.08), transparent 38%),
          linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.12));
      }

      .star {
        position: absolute;
        width: 12px;
        height: 12px;
        background: var(--star);
        border-radius: 50%;
        opacity: 0.9;
        box-shadow: 0 0 18px rgba(245, 211, 106, 0.8);
      }

      .star:nth-child(1) { left: 25%; top: 17%; }
      .star:nth-child(2) { left: 72%; top: 20%; }
      .star:nth-child(3) { left: 58%; top: 38%; }
      .star:nth-child(4) { left: 23%; top: 70%; }
      .star:nth-child(5) { left: 76%; top: 72%; }
      .star:nth-child(6) { left: 50%; top: 82%; }
      .star:nth-child(7) { left: 32%; top: 55%; }
      .star:nth-child(8) { left: 66%; top: 62%; }

      .hero {
        position: relative;
        z-index: 1;
        text-align: center;
        width: min(1280px, 92vw);
      }

      .brand {
        margin: 0;
        font-size: clamp(5rem, 10vw, 15rem);
        line-height: 0.9;
        letter-spacing: -0.07em;
        font-weight: 800;
        color: var(--gold);
        text-shadow: 0 0 30px rgba(242, 201, 107, 0.15);
      }

      .subtitle {
        margin-top: 1.2rem;
        font-size: clamp(1.6rem, 3vw, 3.4rem);
        line-height: 1.45;
        font-weight: 400;
        letter-spacing: -0.04em;
        color: var(--muted);
      }

      .subtitle .separator {
        display: inline-block;
        margin: 0 0.25em;
        opacity: 0.8;
      }

      .cta {
        display: inline-block;
        margin-top: 2.3rem;
        padding: 1.05rem 2.2rem;
        min-width: min(760px, 90%);
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(239, 201, 101, 0.96), rgba(220, 175, 70, 0.96));
        box-shadow: 0 12px 24px rgba(15, 8, 35, 0.18);
        color: rgba(31, 20, 52, 0.92);
        font-size: clamp(2rem, 4vw, 5rem);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.06em;
      }

      .signature {
        margin-top: 2.4rem;
        font-size: clamp(1.8rem, 2.2vw, 3.2rem);
        line-height: 1.3;
        font-weight: 400;
        letter-spacing: -0.04em;
        color: rgba(255, 255, 255, 0.95);
      }

      @media (max-width: 700px) {
        .cta {
          min-width: 100%;
        }

        .brand {
          letter-spacing: -0.04em;
        }
      }
    </style>
  </head>
  <body>
    <div class="page" aria-label="Jyotish Numero landing page">
      <span class="star" aria-hidden="true"></span>
      <span class="star" aria-hidden="true"></span>
      <span class="star" aria-hidden="true"></span>
      <span class="star" aria-hidden="true"></span>
      <span class="star" aria-hidden="true"></span>
      <span class="star" aria-hidden="true"></span>
      <span class="star" aria-hidden="true"></span>
      <span class="star" aria-hidden="true"></span>

      <main class="hero">
        <h1 class="brand">JYOTISH NUMERO</h1>

        <div class="subtitle" aria-label="Free Horoscope and Numerology services">
          <span>Free Horoscope</span>
          <span class="separator">|</span>
          <span>Numerology</span>
          <br />
          <span>Mobile Number Check</span>
          <span class="separator">|</span>
          <span>Name Analysis</span>
          <span class="separator">|</span>
          <span>Lo Shu</span>
          <span class="separator">|</span>
          <span>Dasha</span>
        </div>

        <div class="cta">100% Free - No Sign-up</div>

        <div class="signature">Built by Venkateswara Rao Banday</div>
      </main>
    </div>
  </body>
</html>
