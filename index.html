<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jyotish Numero – free horoscope and numerology tools, with mobile number checks and name analysis.">
  <title>Jyotish Numero – Free Horoscope & Numerology</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; background: #201a6c; color: #f3effe; }
    .hero { position: relative; min-height: 100vh; display: grid; place-items: center; overflow: hidden; padding: 48px 20px; text-align: center; background: linear-gradient(135deg, #201a6c 0%, #49227f 55%, #8d3b78 100%); }
    .hero::before { content: "✦      ·              ✦                  ·       ✦"; position: absolute; inset: 8% 4%; color: #f5d36a; font-size: clamp(18px, 3vw, 32px); letter-spacing: 8vw; opacity: .8; pointer-events: none; }
    .hero-content { position: relative; max-width: 1200px; }
    h1 { margin: 0; color: #f2c96b; font-size: clamp(2.8rem, 9vw, 6rem); line-height: 1.05; letter-spacing: -.055em; font-weight: 850; }
    .subtitle { margin: 20px 0 0; font-size: clamp(1.2rem, 3.2vw, 2.8rem); line-height: 1.5; color: #f3effe; }
    .features { margin-top: 8px; color: #d7cdf8; font-size: clamp(1rem, 2.5vw, 2rem); }
    .pill { display: inline-block; margin-top: 38px; padding: 14px 34px; border-radius: 999px; background: #f2c65f; color: #29134f; font-size: clamp(1.3rem, 3.5vw, 2.4rem); font-weight: 800; }
    .byline {
      margin: 34px 0 0;
      font-size: clamp(1.1rem, 2.5vw, 1.8rem);
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.96);
    }
    .author-name {
      display: inline-block;
      margin-left: 0.15em;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-style: italic;
      background: linear-gradient(120deg, #fff7d1 0%, #f9d777 28%, #fff3c4 60%, #f5c75c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(255, 214, 102, 0.28);
      letter-spacing: 0.04em;
    }
    .app-section { min-height: 100vh; padding: 24px 12px 40px; background: #0d0820; }
    .app-section h2 { max-width: 1000px; margin: 0 auto 12px; color: #ffd27a; font-size: 1.25rem; }
    #app-frame { display: block; width: min(100%, 1100px); height: 100vh; min-height: 900px; margin: 0 auto; border: 1px solid #4b3a8f; border-radius: 12px; background: #0d0820; }
    #load-error { display: none; max-width: 900px; margin: 16px auto; padding: 16px; border: 1px solid #fb7185; border-radius: 10px; color: #fff; }
    @media (max-width: 600px) { .hero { min-height: 82vh; } #app-frame { min-height: 1100px; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>JYOTISH NUMERO</h1>
      <p class="subtitle">Free Horoscope <span aria-hidden="true">|</span> Numerology</p>
      <p class="features">Mobile Number Check <span aria-hidden="true">|</span> Name Analysis <span aria-hidden="true">|</span> Lo Shu <span aria-hidden="true">|</span> Dasha</p>
      <div class="pill">100% Free&nbsp; - &nbsp;No Sign-up</div>
      <p class="byline">Built by <span class="author-name">Venkateswara Rao Banday</span></p>
    </div>
  </header>
  <main class="app-section" id="app">
    <h2>Explore your horoscope and numerology</h2>
    <div id="load-error" role="alert">The app could not be loaded. Please check your internet connection and reload this page.</div>
    <iframe id="app-frame" title="Jyotish Numero horoscope and numerology app" loading="eager" sandbox="allow-scripts allow-forms allow-same-origin allow-modals allow-popups"></iframe>
  </main>
  <script>
    const source = "https://raw.githubusercontent.com/venkatbanday/Jyotish-Numero/13aae4976d11cac01ee4a1f090fa77f8493055c1/index.html";
    fetch(source)
      .then(response => {
        if (!response.ok) throw new Error("App source unavailable");
        return response.text();
      })
      .then(html => {
        document.getElementById("app-frame").srcdoc = html;
      })
      .catch(() => {
        document.getElementById("load-error").style.display = "block";
      });
  </script>
</body>
</html>
